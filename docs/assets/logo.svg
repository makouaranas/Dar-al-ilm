<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Dar al Ilm">
  <title>Dar al Ilm</title>
  <!-- Eight-point star (khatam): two overlapping squares in a single brass outline. -->
  <g fill="none" stroke="#B08A4E" stroke-width="3" stroke-linejoin="round">
    <rect x="22" y="22" width="52" height="52" rx="1.5"/>
    <rect x="22" y="22" width="52" height="52" rx="1.5" transform="rotate(45 48 48)"/>
    <circle cx="48" cy="48" r="9"/>
  </g>
</svg>
